<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Breathing Index — a personal 1–4 air scale</title>
    <meta
      name="description"
      content="Shows each pollutant, heat, and humidity separately, learns your triggers from your own breathing logs, and predicts your day on a personal four-level scale."
    />
    <!--
      Literal copy of DISCLAIMER in src/ui/labels.ts — this page ships before
      the bundle exists, so it cannot import it. Keep the two in step.
    -->
    <meta
      name="disclaimer"
      content="Breathing Index is a logbook lens on public air data — not medical advice. Trust your symptoms and your asthma action plan over anything on this screen."
    />
    <!--
      Two theme colours, because the app follows prefers-color-scheme (the dark
      block in src/styles.css). A single light theme-color leaves an installed
      PWA with a white status bar over a dark screen at 4 AM. Browsers that do
      not understand the media attribute fall through to the light one.
    -->
    <meta name="theme-color" content="#F3F6F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11181D" media="(prefers-color-scheme: dark)" />
    <meta name="author" content="Drew Hoover" />
    <meta name="application-name" content="Breathing Index" />
    <!-- max-image-preview:large is what lets the share card run full width in results. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!--
      Every deep route is served by the SPA 404 shim, so it points here rather
      than claiming to be its own page. Those routes are app state, not content,
      and GitHub Pages returns them with a 404 status anyway.
    -->
    <link rel="canonical" href="https://breathingindex.com/" />

    <!-- iOS home-screen chrome, to match the manifest -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Breathing" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Fonts are self-hosted from public/fonts (see src/fonts.css). The hosted
      Google stylesheet handed Google the IP of everyone who opened the app,
      and left the installed PWA with system type offline.
    -->
    <link
      rel="preload"
      href="/fonts/instrument-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breathing Index" />
    <meta property="og:title" content="Breathing Index — a personal 1–4 air scale" />
    <meta
      property="og:description"
      content="A “moderate” AQI can floor you one day and be fine the next. Breathing Index splits the AQI into the measurements it hides, learns your triggers from your own breathing logs, and predicts your day on a 1–4 scale."
    />
    <meta property="og:url" content="https://breathingindex.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://breathingindex.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Share card for Breathing Index: the app name and tagline on a white card, a bar chart of one day's hourly air readings rising to a single red peak, and the scale from 1 Easy through 2 Noticeable and 3 Limiting to 4 Dangerous."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Breathing Index — a personal 1–4 air scale" />
    <meta
      name="twitter:description"
      content="A “moderate” AQI can floor you one day and be fine the next. Breathing Index splits the AQI into the measurements it hides, learns your triggers from your own breathing logs, and predicts your day on a 1–4 scale."
    />
    <meta name="twitter:image" content="https://breathingindex.com/og.png" />
    <meta
      name="twitter:image:alt"
      content="Share card for Breathing Index: the app name and tagline on a white card, a bar chart of one day's hourly air readings rising to a single red peak, and the scale from 1 Easy through 2 Noticeable and 3 Limiting to 4 Dangerous."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Breathing Index",
        "url": "https://breathingindex.com/",
        "description": "Shows each pollutant, heat, and humidity separately, learns your triggers from your own breathing logs, and predicts your day on a personal four-level scale.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "image": "https://breathingindex.com/og.png",
        "author": {
          "@type": "Person",
          "name": "Drew Hoover",
          "url": "https://drewhoover.com/",
          "sameAs": ["https://github.com/DrewHoo"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      The app is client-rendered, so #root is empty until JS runs. Googlebot
      renders it, but plenty of crawlers and link unfurlers do not — this gives
      them, and anyone without JS, the actual pitch rather than a blank page.
    -->
    <noscript>
      <main>
        <h1>Breathing Index</h1>
        <p>
          A personal air quality index. The composite AQI lumps every pollutant into one number —
          which is how a “moderate” day can floor you while a worse-rated one is fine. Breathing
          Index shows each measurement — fine and coarse particles, ozone, NO₂, heat, humidity —
          separately, learns which ones actually affect you from your own breathing logs, and
          predicts your day on a four-level scale: 1 Easy, 2 Noticeable, 3 Limiting, 4 Dangerous.
        </p>
        <p>
          It's free, and your logs live only in your browser. It needs JavaScript to run. Data
          comes from Open-Meteo, with AirNow station comparison in the US.
        </p>
        <p>
          Breathing Index is a logbook lens on public air data — not medical advice. Trust your
          symptoms and your asthma action plan over anything on this screen.
        </p>
        <p><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
